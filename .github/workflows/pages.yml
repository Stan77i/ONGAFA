name: Site GitHub Pages

# Site statique publié sur https://stan77i.github.io/ONGAFA/
# Reconstruit à chaque modification et toutes les 6 heures (nouvelles informations de la veille).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_SITE_URL: https://stan77i.github.io/ONGAFA
      # Valeurs publiques (adresse du projet et clé « publishable », lecture seule selon la RLS).
      NEXT_PUBLIC_SUPABASE_URL: https://jpoeuqywbuwtuvefxpcb.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EuSowJCTfjQN2rDc6kELhg_UTwJ2GrH
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
